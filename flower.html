<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b24">
<link rel="icon" href="img/flowers.png" type="image/png">
<title>Jardín de noche estrellada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--gold:#ffd95a;--gold2:#fff0a8;--ink:#050b24;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;font-family:'Caveat','Segoe UI',cursive;color:#fff;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#bg{image-rendering:pixelated;object-fit:cover;z-index:0}
#fx{z-index:1;pointer-events:none}
header{position:fixed;top:0;left:0;right:0;z-index:20;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 0;pointer-events:none}
h1{font-family:'Great Vibes','Brush Script MT',cursive;font-weight:400;margin:0 auto;max-width:15em;font-size:clamp(1.7rem,4.8vw,3.5rem);line-height:1.15;color:var(--gold2);text-shadow:0 0 14px rgba(255,217,90,.75),0 2px 0 #6b4a00,0 0 40px rgba(255,200,40,.4)}
.w{display:inline-block;white-space:nowrap;margin:0 .14em}
.l{display:inline-block;opacity:0;transform:translateY(16px) scale(.5);animation:letter .8s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes letter{to{opacity:1;transform:none}}
.sub{font-size:clamp(1.15rem,2.4vw,1.7rem);color:#dbe7ff;margin:10px auto 0;opacity:0;animation:fade 2s ease forwards;text-shadow:0 2px 10px #000}
.hint{font-size:1rem;color:#a9c0f0;opacity:0;margin-top:4px;animation:fade 2s ease forwards}
@keyframes fade{to{opacity:.95}}
#stage{position:fixed;inset:0;z-index:5}
#tw{position:absolute;left:58%;bottom:calc(11svh);height:clamp(300px,64svh,600px);aspect-ratio:200/430;z-index:7;pointer-events:none}
#tw svg{width:100%;height:100%;overflow:visible;shape-rendering:crispEdges;filter:drop-shadow(0 0 22px rgba(255,210,90,.18))}
.glow{animation:pg 3s ease-in-out infinite alternate;filter:drop-shadow(0 0 7px #ffd95a)}
@keyframes pg{from{opacity:.78}to{opacity:1}}
#tw #prince{position:absolute;left:66%;bottom:-1%;width:36%;height:auto;cursor:pointer;z-index:4;overflow:visible;shape-rendering:auto;pointer-events:auto}
#princess{cursor:pointer;pointer-events:auto}
#hill{position:absolute;left:0;right:0;bottom:0;height:24svh;width:100%;z-index:4;pointer-events:none}
#garden{position:absolute;left:0;right:0;bottom:0;height:40svh;z-index:6;cursor:pointer}
.fl{position:absolute;bottom:0;transform-origin:50% 100%;animation:sway var(--d,4s) ease-in-out infinite alternate,grow 1.4s cubic-bezier(.2,1.4,.4,1) backwards;cursor:pointer}
.fl svg{display:block;height:100%;width:auto;overflow:visible;filter:drop-shadow(0 0 8px var(--g,rgba(255,217,90,.35)))}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes grow{from{scale:0;opacity:0}to{scale:1;opacity:1}}
#grass{position:absolute;left:0;bottom:0;width:100%;height:100%;pointer-events:none}
#grass.f{z-index:2}
.gb{transform-origin:50% 100%;animation:sway var(--d,3s) ease-in-out infinite alternate;transform-box:fill-box}
.bub,.heart,.petal,.spk{position:fixed;pointer-events:none;z-index:60}
.bub{background:#fffbe8;color:#1b2550;font-family:'Caveat',cursive;font-size:20px;padding:3px 12px;border-radius:14px;box-shadow:0 4px 14px #0007;animation:pop .3s ease-out,out .4s ease-in 1.3s forwards;translate:-50% 0}
@keyframes pop{from{scale:.3;opacity:0}}
@keyframes out{to{opacity:0;transform:translateY(-12px)}}
.heart{font-size:24px;animation:up 1.9s ease-out forwards;filter:drop-shadow(0 0 6px #f43f5e99)}
@keyframes up{0%{opacity:1;transform:translateY(0) scale(.7)}100%{opacity:0;transform:translateY(-110px) scale(1.5) rotate(18deg)}}
.petal{width:9px;height:14px;border-radius:50% 50% 50% 0;animation:pt 1.1s ease-out forwards}
@keyframes pt{to{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0}}
.spk{width:10px;height:10px;border-radius:50%;background:radial-gradient(#fff3a0,#ffd95a00 70%);animation:sp .9s forwards}
@keyframes sp{to{transform:scale(2.4);opacity:0}}
#music{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));z-index:50;display:flex;align-items:center;gap:10px;background:#050b24cc;border:1px solid #ffd95a55;border-radius:999px;padding:6px 16px 6px 6px;backdrop-filter:blur(6px);cursor:pointer;font-size:18px;color:#ffeaa0}
#music b{width:36px;height:36px;border-radius:50%;background:var(--gold);color:#050b24;display:grid;place-items:center;font-size:16px}
@media (max-width:640px){
h1{font-size:clamp(1.55rem,8vw,2.2rem);max-width:12em}
.sub{font-size:1.05rem;max-width:20em}
.hint{font-size:.9rem}
#tw{left:27%;bottom:9svh;height:clamp(250px,52svh,460px)}
#tw #prince{left:64%;width:40%}
#hill{height:20svh}
#garden{height:32svh}
#music{padding:6px}
#music span{display:none}
}
@media (max-height:520px){.sub,.hint{display:none}h1{font-size:1.5rem}#tw{height:56svh;bottom:8svh}#garden{height:30svh}}
@media (prefers-reduced-motion:reduce){.fl,.gb,.glow{animation:none}.l{animation-duration:.01s}}
</style>
</head>

<div id="music" onclick="toggleMusic()"><b id="mi">▶</b><span id="ms">Música ambiental</span></div>
<audio id="aud" loop preload="metadata"><source src="sound/la-vie-en-rose.mp3" type="audio/mpeg"></audio>

<script>
/* ===== Starry Night painting (low-res, pixelated) ===== */
const W=256,H=144,bg=document.getElementById('bg');bg.width=W;bg.height=H;
const bx=bg.getContext('2d');
const STARS=[[.17,.14],[.3,.09],[.46,.13],[.62,.1],[.7,.3],[.1,.4],[.4,.32],[.56,.22],[.92,.42]];
const MOON=[.84,.17];
const C=STARS.map(([a,b])=>[a*W,b*H,5,1,1]).concat([[MOON[0]*W,MOON[1]*H,10,1.6,1],[.5*W,.32*H,26,1.3,0],[.78*W,.45*H,16,.8,0],[.22*W,.5*H,18,.8,0]]);
const PAL=['#07123a','#0b1a4a','#10246b','#17338f','#1f46b0','#2b5fcf','#4a82e0','#8fb4ee','#d4e3f8'];
const GOLD=['#c98a1a','#f2c14e','#ffe08a','#fff4c0'];
const ridge=x=>H*.8+Math.sin(x*.03)*5+Math.sin(x*.012+1)*9;
function paint(){
  bx.fillStyle='#0b1a4a';bx.fillRect(0,0,W,H);
  const vec=(px,py)=>{const a=Math.sin(px*.05+py*.02)*.8+Math.cos(py*.07)*.4;let vx=Math.cos(a),vy=Math.sin(a);
    for(const[c0,c1,r,k]of C){const dx=px-c0,dy=py-c1,d=Math.hypot(dx,dy)+.01,w=k*3*Math.exp(-d*d/(2*(r*1.6)**2));vx+=-dy/d*w;vy+=dx/d*w}
    return[vx,vy]};
  const bri=(px,py)=>{let g=0;for(const[c0,c1,r,k]of C){const d=Math.hypot(px-c0,py-c1);g+=k*Math.exp(-d*d/(2*(r*1.8)**2))}
    return .25+.22*Math.sin(px*.09+py*.05)*Math.cos(py*.11)+g*.45+Math.random()*.2};
  for(let n=0;n<9000;n++){
    let px=Math.random()*W,py=Math.random()*H*.85,len=4+Math.random()*9;
    for(let s=0;s<len;s++){
      if(py>ridge(px))break;
      const b=bri(px,py);let col,gold=false;
      for(const[c0,c1,r,k,g]of C)if(g&&Math.hypot(px-c0,py-c1)<r*.55){gold=true;break}
      col=gold?GOLD[Math.min(3,Math.floor(Math.random()*4))]:PAL[Math.max(0,Math.min(8,Math.floor(b*8)))];
      bx.fillStyle=col;bx.fillRect(px|0,py|0,2,2);
      const[vx,vy]=vec(px,py),m=Math.hypot(vx,vy);px+=vx/m*1.5;py+=vy/m*1.5;
    }
  }
  const GP=['#03081f','#050d33','#081545','#0e2060','#142a78'];
  for(let n=0;n<4200;n++){
    let px=Math.random()*W,py=ridge(px)+Math.random()*(H-ridge(px)),len=5+Math.random()*8,a=Math.sin(px*.05)*.5;
    const c=GP[Math.min(4,Math.floor(Math.random()*Math.random()*5+(py<ridge(px)+8?1.5:0)))];
    bx.fillStyle=c;for(let s=0;s<len;s++){bx.fillRect(px|0,py|0,2,2);px+=Math.cos(a)*1.5;py+=Math.sin(a)*.6}
  }
  bx.fillStyle='#ffd25a';
  for(let i=0;i<14;i++){const x=20+Math.random()*50|0;bx.fillRect(x,(ridge(x)+4+Math.random()*5)|0,1,1)}
  // Luna
  const mx=MOON[0]*W,my=MOON[1]*H;
  bx.fillStyle='#fff0a8';bx.beginPath();bx.arc(mx,my,8,0,Math.PI*2);bx.fill();
  bx.fillStyle='#0b1a4a';bx.beginPath();bx.arc(mx-3,my-2,7,0,Math.PI*2);bx.fill();
}
paint();

/* ===== FX: glowing stars, moon, shooting stars, fireflies ===== */
const fx=document.getElementById('fx'),fc=fx.getContext('2d');let FW,FH;
function size(){FW=fx.width=innerWidth;FH=fx.height=innerHeight}size();addEventListener('resize',size);
// map normalized painting coords to the cover-fitted canvas
function map(nx,ny){const s=Math.max(FW/W,FH/H),ox=(FW-W*s)/2,oy=(FH-H*s)/2;return[ox+nx*W*s,oy+ny*H*s,s]}
const shoot=[];let nextShoot=600;
const flies=Array.from({length:innerWidth<640?16:30},()=>({x:Math.random(),y:.5+Math.random()*.45,p:Math.random()*9,s:.2+Math.random()*.5}));
const tiny=Array.from({length:70},()=>({x:Math.random(),y:Math.random()*.7,p:Math.random()*9,r:.6+Math.random()*1.2}));
function spawnShoot(big){
  const fromRight=Math.random()<.5,x=Math.random()*FW*.8+FW*.1,y=Math.random()*FH*.3;
  const sp=(big?14:9)+Math.random()*5,a=(fromRight?Math.PI-.5:.5)+(Math.random()*.2-.1);
  shoot.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,len:big?220:140,w:big?3:2});
}
let t0=performance.now();
function loop(t){
  const tt=(t-t0)/1000;fc.clearRect(0,0,FW,FH);fc.globalCompositeOperation='lighter';
  for(const s of tiny){const a=.25+.75*Math.abs(Math.sin(tt*.8+s.p));fc.fillStyle=`rgba(255,246,200,${a*.7})`;fc.fillRect(s.x*FW,s.y*FH,s.r,s.r)}
  STARS.concat([MOON]).forEach(([nx,ny],i)=>{
    const[x,y,s]=map(nx,ny),moon=i===STARS.length,R=(moon?26:14)*s*(1+.12*Math.sin(tt*1.5+i*1.7));
    const g=fc.createRadialGradient(x,y,0,x,y,R*2.6);
    g.addColorStop(0,`rgba(255,235,140,${moon?.75:.5})`);g.addColorStop(.35,'rgba(255,200,70,.22)');g.addColorStop(1,'rgba(255,200,70,0)');
    fc.fillStyle=g;fc.beginPath();fc.arc(x,y,R*2.6,0,7);fc.fill();
    fc.strokeStyle=`rgba(255,240,170,${.15+.1*Math.sin(tt*2+i)})`;fc.lineWidth=2;fc.beginPath();fc.arc(x,y,R*1.4,0,7);fc.stroke();
  });
  for(const f of flies){
    const x=(f.x+Math.sin(tt*f.s+f.p)*.03)*FW,y=(f.y+Math.cos(tt*f.s*1.3+f.p)*.03)*FH,a=.35+.65*Math.abs(Math.sin(tt*1.4+f.p));
    const g=fc.createRadialGradient(x,y,0,x,y,12);g.addColorStop(0,`rgba(255,240,130,${a})`);g.addColorStop(1,'rgba(255,200,40,0)');
    fc.fillStyle=g;fc.beginPath();fc.arc(x,y,12,0,7);fc.fill();
  }
  if(t>nextShoot){spawnShoot(Math.random()<.25);nextShoot=t+1200+Math.random()*2800}
  for(let i=shoot.length-1;i>=0;i--){
    const s=shoot[i];s.x+=s.vx;s.y+=s.vy;s.life-=.012;
    if(s.life<=0){shoot.splice(i,1);continue}
    const m=Math.hypot(s.vx,s.vy),tx=s.x-s.vx/m*s.len,ty=s.y-s.vy/m*s.len;
    const g=fc.createLinearGradient(s.x,s.y,tx,ty);g.addColorStop(0,`rgba(255,250,210,${s.life})`);g.addColorStop(1,'rgba(255,217,90,0)');
    fc.strokeStyle=g;fc.lineWidth=s.w;fc.lineCap='round';fc.beginPath();fc.moveTo(s.x,s.y);fc.lineTo(tx,ty);fc.stroke();
    fc.fillStyle=`rgba(255,255,230,${s.life})`;fc.beginPath();fc.arc(s.x,s.y,s.w+1,0,7);fc.fill();
  }
  fc.globalCompositeOperation='source-over';requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
for(let i=0;i<3;i++)setTimeout(()=>spawnShoot(i==1),700+i*900);

/* ===== Title letter by letter ===== */
const TXT='Estas flores amarillas son un reflejo de la alegría que traes a mi vida.';let k=0;
document.getElementById('title').innerHTML=TXT.split(' ').map(w=>'<span class="w">'+[...w].map(c=>`<span class="l" style="animation-delay:${(k++*.055+.4).toFixed(2)}s">${c}</span>`).join('')+'</span>').join(' ');

/* ===== Garden ===== */
const G=document.getElementById('garden');
const rnd=(a,b)=>a+Math.random()*(b-a);
function petals(n,rx,ry,off,c,extra=''){let s='';for(let i=0;i<n;i++)s+=`<ellipse cx="0" cy="${-off}" rx="${rx}" ry="${ry}" transform="rotate(${i*360/n})" fill="${c}" ${extra}/>`;return s}
const STEM=(c='#2f9e44')=>`<path d="M50 200Q${rnd(35,65)|0} 120 50 52" stroke="${c}" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M50 150Q75 138 80 118Q58 122 50 150Z" fill="#2b8a3e"/><path d="M50 170Q26 158 22 138Q44 142 50 170Z" fill="#237a35"/>`;
const TYPES={
 sun:()=>({g:'rgba(255,217,90,.5)',svg:`<svg viewBox="0 0 100 200">${STEM()}<g transform="translate(50 46)">${petals(16,6,15,25,'#f2a60d')}${petals(16,6,14,22,'#ffd43b','transform-origin="0 0" style="rotate:11deg"')}<circle r="14" fill="#5a3410"/><circle r="9" fill="#7a4a18"/><circle r="4" fill="#3d2108"/></g></svg>`}),
 tulip:(c1,c2,g)=>({g,svg:`<svg viewBox="0 0 100 200">${STEM()}<g transform="translate(50 50)"><path d="M-17 0C-24-22-10-38 0-34C10-38 24-22 17 0C10 12-10 12-17 0Z" fill="${c1}"/><path d="M-8 0C-14-20-4-34 0-34L2 4Z" fill="${c2}"/><path d="M4 2C10-18 8-30 0-34C14-34 22-20 17 0Z" fill="${c1}" opacity=".6"/></g></svg>`}),
 daisy:()=>({g:'rgba(255,255,255,.35)',svg:`<svg viewBox="0 0 100 200">${STEM()}<g transform="translate(50 52)">${petals(12,4.5,11,15,'#f8fbff')}<circle r="7" fill="#ffc300"/></g></svg>`}),
 lav:()=>({g:'rgba(190,150,255,.5)',svg:`<svg viewBox="0 0 100 200"><path d="M50 200Q44 120 50 40" stroke="#4c9a5b" stroke-width="3" fill="none"/>${[0,1,2,3,4,5,6,7].map(i=>`<ellipse cx="${50+(i%2?5:-5)}" cy="${42+i*10}" rx="5" ry="7" fill="${i%3?'#b388ff':'#9b6bf2'}"/>`).join('')}</svg>`}),
 rose:()=>({g:'rgba(255,200,60,.5)',svg:`<svg viewBox="0 0 100 200">${STEM()}<g transform="translate(50 52)"><circle r="17" fill="#f5b800"/><circle r="12" fill="#ffd43b"/><path d="M-8 0Q0-12 8 0Q0 8-8 0M-4-4Q0-9 4-4" stroke="#c98a00" stroke-width="2" fill="none"/><circle r="3" fill="#ff8a00"/></g></svg>`})
};
function makeFlower(type,h,x,delay=0){
  const t=({sun:TYPES.sun,tulipP:()=>TYPES.tulip('#ec4899','#f9a8d4','rgba(244,114,182,.5)'),tulipV:()=>TYPES.tulip('#9b51e0','#d0a2ff','rgba(192,132,252,.5)'),tulipY:()=>TYPES.tulip('#f2b705','#fff0a0','rgba(255,217,90,.5)'),daisy:TYPES.daisy,lav:TYPES.lav,rose:TYPES.rose})[type]();
  const d=document.createElement('div');d.className='fl';
  d.style.cssText=`left:${x}px;height:${h}px;--d:${rnd(3,5.5).toFixed(1)}s;--g:${t.g};animation-delay:${rnd(0,2)}s,${delay}s`;
  d.innerHTML=t.svg;d.onclick=e=>{e.stopPropagation();burst(e.clientX,e.clientY);chime()};
  G.appendChild(d);return d;
}
function grassLayer(front){
  const ns='http://www.w3.org/2000/svg',s=document.createElementNS(ns,'svg');s.id='grass';if(front)s.className.baseVal='f';
  s.setAttribute('preserveAspectRatio','none');s.setAttribute('viewBox',`0 0 ${innerWidth} 200`);
  let h='';const n=Math.floor(innerWidth/(front?9:7));
  for(let i=0;i<n;i++){const x=Math.random()*innerWidth,ht=front?rnd(20,60):rnd(40,100),lean=rnd(-14,14),w=rnd(2,4.5);
    const c=['#1d6b3a','#2b8a3e','#37a04c','#14532d','#4caf50'][Math.floor(Math.random()*5)];
    h+=`<path class="gb" style="--d:${rnd(2,4).toFixed(1)}s;animation-delay:${rnd(0,2).toFixed(1)}s" d="M${x} 200Q${x+lean*.3} ${200-ht*.5} ${x+lean} ${200-ht}Q${x+w} ${200-ht*.5} ${x+w*1.6} 200Z" fill="${c}"/>`;
    if(front&&Math.random()<.07)h+=`<circle cx="${x+lean}" cy="${200-ht}" r="3" fill="#ffe27a"/>`}
  s.innerHTML=h;return s;
}
function plant(){
  G.innerHTML='';G.appendChild(grassLayer(false));
  const gh=G.clientHeight,n=Math.max(8,Math.round(innerWidth/78)),types=['sun','tulipP','tulipY','daisy','tulipV','rose','lav','sun','tulipY','rose'];
  for(let i=0;i<n;i++){
    const type=types[i%types.length],tall=type==='sun'?rnd(.8,1.05):type==='lav'?rnd(.5,.7):rnd(.55,.85);
    makeFlower(type,gh*tall*.92,(i+.5)/n*innerWidth-30+rnd(-14,14),i*.07);
  }
  G.appendChild(grassLayer(true));
}
plant();let lastW=innerWidth;addEventListener('resize',()=>{if(Math.abs(innerWidth-lastW)>120){lastW=innerWidth;plant()}});
G.onclick=e=>{const types=['sun','tulipY','rose','daisy','tulipP'],ty=types[Math.floor(Math.random()*types.length)];
  makeFlower(ty,G.clientHeight*rnd(.5,.85),e.clientX-30);hearts(e.clientX,e.clientY-30,2);chime()};

/* ===== Particles ===== */
function bubble(x,y,t){const b=document.createElement('div');b.className='bub';b.textContent=t;b.style.left=x+'px';b.style.top=y-24+'px';document.body.appendChild(b);setTimeout(()=>b.remove(),1800)}
function hearts(x,y,n=3){for(let i=0;i<n;i++){const h=document.createElement('div');h.className='heart';h.textContent=['❤️','💛','💕'][i%3];h.style.left=x+rnd(-18,18)+'px';h.style.top=y+'px';h.style.animationDelay=i*.14+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),2200)}}
function burst(x,y){const cs=['#ffd43b','#f2a60d','#fff0a0','#ff9fc4'];for(let i=0;i<10;i++){const p=document.createElement('div');p.className='petal';p.style.cssText=`left:${x}px;top:${y}px;background:${cs[i%4]};--dx:${rnd(-70,70)}px;--dy:${rnd(-90,30)}px`;document.body.appendChild(p);setTimeout(()=>p.remove(),1200)}hearts(x,y-10,2)}
addEventListener('pointermove',e=>{if(Math.random()<.25){const s=document.createElement('div');s.className='spk';s.style.left=e.clientX-5+'px';s.style.top=e.clientY-5+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),900)}});
function princess(e){e.stopPropagation();chime();const r=e.currentTarget.getBoundingClientRect();hearts(r.left+r.width/2,r.top,5);bubble(r.left+r.width/2,r.top-6,'Te quiero 💛')}
function prince(e){e.stopPropagation();chime();const r=e.currentTarget.getBoundingClientRect();hearts(r.left+r.width/2,r.top,4);bubble(r.left+r.width/2,r.top-6,'Para ti, mi princesa 🌹');
  const p=document.getElementById('princess').getBoundingClientRect();setTimeout(()=>hearts(p.left+p.width/2,p.top+20,4),350)}

/* ===== Sounds + music ===== */
let ac;const ctx=()=>{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.state==='suspended'&&ac.resume();return ac};
function tone(f1,f2,dur,type='sine',v=.12){try{const a=ctx(),o=a.createOscillator(),g=a.createGain(),n=a.currentTime;o.type=type;o.frequency.setValueAtTime(f1,n);o.frequency.exponentialRampToValueAtTime(f2,n+dur*.5);o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.001,n);g.gain.linearRampToValueAtTime(v,n+.05);g.gain.exponentialRampToValueAtTime(.001,n+dur);o.start(n);o.stop(n+dur+.02)}catch(e){}}
const chime=()=>tone(660,1320,.35,'triangle',.08);
const aud=document.getElementById('aud'),mi=document.getElementById('mi'),ms=document.getElementById('ms');
let playing=false;
function setUI(p){playing=p;mi.textContent=p?'❚❚':'▶';ms.textContent=p?'Reproduciendo…':'Música ambiental'}
function toggleMusic(){
  if(playing){aud.pause();setUI(false);return}
  aud.play().then(()=>setUI(true)).catch(()=>{ms.textContent='No se encontró la música'});
}
// En celular el audio solo puede empezar con un toque: el primero (en cualquier parte) inicia la música
addEventListener('pointerdown',e=>{if(!playing&&!e.target.closest('#music'))toggleMusic()},{once:true});
aud.querySelector('source').addEventListener('error',()=>{ms.textContent='No se encontró la música'});
</script>
</body>
</html>
